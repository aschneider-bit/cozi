<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozi Allowance Tracker — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --orange:      #f26522;
    --orange-dk:   #d4541a;
    --blue:        #3bbbe9;
    --blue-dk:     #29ABE2;
    --blue-lt:     #e8f7fd;
    --text:        #494949;
    --text-dark:   #1a1a1a;
    --text-muted:  #727473;
    --bg-page:     #ffffff;
    --bg-section:  #f7f7f5;
    --bg-card:     #ffffff;
    --border:      #e0e0e0;
    --green:       #C9EBCF;
    --green-text:  #03563A;
    --purple:      #8b5cf6;
    --font: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: #e8edf2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  /* ── Phone frame ── */
  .phone {
    width: 390px;
    height: 844px;
    background: #000;
    border-radius: 50px;
    box-shadow:
      0 0 0 2px #555,
      0 0 0 4px #222,
      0 32px 80px rgba(0,0,0,.45);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* notch */
  .phone::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 130px; height: 34px;
    background: #000;
    border-radius: 0 0 20px 20px;
    z-index: 100;
  }

  /* status bar */
  .status-bar {
    height: 44px;
    background: var(--blue);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 24px 6px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .status-bar span { color: #fff; font-size: 12px; font-weight: 600; }

  /* screen container */
  .screen-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: var(--bg-section);
  }

  /* individual screens */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg-section);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
  }
  .screen.offscreen-right { transform: translateX(100%); }
  .screen.offscreen-left  { transform: translateX(-100%); }

  /* scrollable body */
  .screen-body {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .screen-body::-webkit-scrollbar { display: none; }

  /* ── Bottom nav ── */
  .bottom-nav {
    height: 83px;
    background: #fff;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-around;
    padding-top: 10px;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    min-width: 56px;
  }
  .nav-icon { font-size: 22px; line-height: 1; }
  .nav-label { font-size: 10px; color: var(--text-muted); }
  .nav-item.active .nav-label { color: var(--blue); font-weight: 600; }

  /* ── App header ── */
  .app-header {
    background: var(--blue);
    padding: 12px 16px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .app-header h1 { color: #fff; font-size: 18px; font-weight: 700; }
  .header-actions { display: flex; gap: 12px; }
  .header-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; padding: 4px; }

  /* tab bar */
  .tab-bar {
    display: flex;
    background: var(--blue-dk);
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 0;
    color: rgba(255,255,255,.7);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: 3px solid transparent;
  }
  .tab.active { color: #fff; border-bottom-color: #fff; }

  /* week nav */
  .week-nav {
    background: #fff;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .week-arrow { background: none; border: none; color: var(--text-muted); font-size: 16px; cursor: pointer; padding: 4px 6px; }
  .week-days { display: flex; gap: 4px; flex: 1; justify-content: center; }
  .day-circle {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 600; color: var(--text-muted); cursor: pointer;
  }
  .day-circle span:first-child { font-size: 8px; }
  .day-circle span:last-child { font-size: 11px; }
  .day-circle.today { background: var(--blue); color: #fff; }

  /* person section */
  .person-section { margin: 12px 12px 0; }
  .person-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: #fff;
    border-radius: 10px 10px 0 0;
    border-bottom: 1px solid var(--border);
  }
  .person-dot {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .person-name { font-size: 14px; font-weight: 700; color: var(--text-dark); flex: 1; }
  .allowance-chip {
    background: var(--blue-lt);
    color: var(--blue-dk);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid rgba(59,187,233,.3);
  }
  .allowance-chip:hover { background: var(--blue); color: #fff; }

  /* chore item */
  .chore-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    background: #fff;
    border-bottom: 1px solid #f0f0f0;
  }
  .chore-item:last-child { border-radius: 0 0 10px 10px; border-bottom: none; }
  .chore-check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .chore-check.checked { background: #4ade80; border-color: #4ade80; }
  .chore-check.checked::after { content: '✓'; color: #fff; font-size: 11px; font-weight: 700; }
  .chore-label { font-size: 13px; color: var(--text); flex: 1; }
  .chore-label.done { text-decoration: line-through; color: var(--text-muted); }
  .chore-value {
    font-size: 12px; font-weight: 700; color: var(--text-muted);
    padding: 2px 6px; border-radius: 6px;
  }
  .chore-value.editable { cursor: pointer; }
  .chore-value.editable:hover { background: var(--bg-section); }
  .chore-value.earned { color: #16a34a; }
  .chore-value-input {
    width: 52px; font-size: 12px; font-weight: 700; color: var(--text-dark);
    border: none; border-bottom: 2px solid var(--blue); outline: none;
    font-family: var(--font); text-align: right; background: transparent;
  }
  .add-chore {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 12px;
    background: #fff;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    border-radius: 0 0 10px 10px;
    border-top: 1px solid #f0f0f0;
  }

  /* ── Dashboard header ── */
  .dash-header {
    background: var(--blue);
    padding: 12px 16px 14px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }
  .back-btn {
    background: none; border: none;
    color: #fff; font-size: 22px;
    cursor: pointer; padding: 4px 8px 4px 0;
    display: flex; align-items: center; gap: 4px;
  }
  .back-btn span { font-size: 14px; font-weight: 600; }
  .dash-title { flex: 1; text-align: center; color: #fff; font-size: 17px; font-weight: 700; }

  /* child tabs */
  .child-tabs {
    display: flex;
    background: rgba(0,0,0,.15);
    margin: 0 16px 14px;
    border-radius: 8px;
    padding: 3px;
  }
  .child-tab {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 6px 0;
    border-radius: 6px;
    cursor: pointer;
    color: rgba(255,255,255,.7);
    font-size: 13px; font-weight: 600;
    transition: all .2s;
  }
  .child-tab.active { background: #fff; color: var(--blue-dk); }
  .child-avatar {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff;
  }
  .child-tab.active .child-avatar { color: #fff; }

  /* cards */
  .card {
    background: #fff;
    border-radius: 12px;
    margin: 12px 12px 0;
    padding: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  .card:last-child { margin-bottom: 12px; }
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
    gap: 8px;
  }
  .card-header-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-title { font-size: 13px; font-weight: 700; color: var(--text-dark); }
  .edit-link { font-size: 12px; color: var(--orange); font-weight: 600; cursor: pointer; white-space: nowrap; }
  .edit-link:hover { color: var(--orange-dk); }

  /* progress */
  .earn-amount { font-size: 26px; font-weight: 700; color: var(--text-dark); }
  .earn-total { font-size: 14px; color: var(--text-muted); }
  .progress-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  .progress-bar { flex: 1; height: 8px; background: #e5e7eb; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--blue); border-radius: 4px; transition: width .4s; }
  .chores-left { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .chores-left strong { color: var(--orange); }
  .next-payment { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

  .payout-btn {
    width: 100%;
    margin-top: 12px;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 9999px;
    padding: 11px 0;
    font-size: 14px;
    font-weight: 700;
    font-family: var(--font);
    cursor: pointer;
  }
  .payout-btn:hover { background: var(--blue-dk); }
  .payout-empty {
    font-size: 12px; color: var(--text-muted);
    text-align: center; margin-top: 12px;
  }

  /* activity */
  .activity-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .activity-item:last-child { border-bottom: none; padding-bottom: 0; }
  .activity-icon {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg-section);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .activity-info { flex: 1; }
  .activity-name { font-size: 13px; font-weight: 600; color: var(--text-dark); }
  .activity-date { font-size: 11px; color: var(--text-muted); }
  .activity-amount { font-size: 13px; font-weight: 700; }
  .activity-amount.credit { color: #16a34a; }
  .activity-amount.settled { color: var(--text-muted); }
  .activity-empty { font-size: 12px; color: var(--text-muted); text-align: center; padding: 8px 0; }

  /* ── Allowance settings screen ── */
  .allowance-header {
    background: var(--bg-section);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
  }
  .back-btn-lt {
    background: none; border: none;
    color: var(--blue); font-size: 22px;
    cursor: pointer; padding: 4px 8px 4px 0;
  }
  .allowance-title { flex: 1; text-align: center; font-size: 17px; font-weight: 700; color: var(--text-dark); }
  .history-btn {
    background: none; border: none;
    color: var(--blue); font-size: 13px; font-weight: 600;
    cursor: pointer; padding: 4px;
  }

  .section-label {
    font-size: 11px; font-weight: 700; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .6px;
    padding: 14px 16px 6px;
  }

  /* amount row */
  .amount-row {
    background: #fff;
    display: flex; align-items: center;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .amount-value { font-size: 28px; font-weight: 700; color: var(--text-dark); flex: 1; }
  .amount-unit { font-size: 14px; color: var(--text-muted); align-self: flex-end; margin-bottom: 4px; }

  .amount-meta {
    background: #fff;
    padding: 8px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .amount-meta p { font-size: 12px; color: var(--text-muted); line-height: 1.6; }

  /* partial payment circle */
  .partial-card { background: #fff; border-radius: 12px; margin: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .partial-header { font-size: 13px; font-weight: 700; color: var(--text-dark); margin-bottom: 14px; }
  .partial-body { display: flex; align-items: center; gap: 16px; }
  .partial-circle-wrap { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
  .partial-circle { width: 80px; height: 80px; border-radius: 50%; }
  .partial-inner {
    position: absolute; inset: 9px;
    border-radius: 50%; background: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .partial-pct { font-size: 14px; font-weight: 700; color: var(--text-dark); }
  .partial-info { flex: 1; }
  .partial-earned { font-size: 20px; font-weight: 700; color: var(--text-dark); }
  .partial-label { font-size: 12px; color: var(--text-muted); }
  .partial-chores { font-size: 13px; color: var(--orange); font-weight: 600; margin-top: 6px; }

  /* toggle */
  .toggle-row {
    background: #fff;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    margin-top: 12px;
    cursor: pointer;
  }
  .toggle-label { flex: 1; font-size: 14px; font-weight: 600; color: var(--text-dark); }
  .toggle-switch {
    width: 48px; height: 28px; border-radius: 14px;
    background: #ccc;
    position: relative; transition: background .2s;
    flex-shrink: 0;
  }
  .toggle-switch.on { background: var(--blue); }
  .toggle-switch::after {
    content: '';
    position: absolute; top: 3px; left: 3px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.25);
    transition: transform .2s;
  }
  .toggle-switch.on::after { transform: translateX(20px); }
  .toggle-note { font-size: 12px; color: var(--text-muted); padding: 8px 16px 14px; background: #fff; border-bottom: 1px solid var(--border); }

  /* CTA card */
  .cta-card {
    margin: 12px;
    background: var(--blue-lt);
    border: 1px solid rgba(59,187,233,.3);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
  }
  .cta-card:hover { background: var(--blue); }
  .cta-card:hover .cta-text, .cta-card:hover .cta-sub { color: #fff; }
  .cta-icon { font-size: 28px; flex-shrink: 0; }
  .cta-text { font-size: 14px; font-weight: 700; color: var(--blue-dk); }
  .cta-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

  /* ── iOS-style alert ── */
  .alert-overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,.4);
    display: none;
    align-items: center; justify-content: center;
    z-index: 200;
  }
  .alert-overlay.visible { display: flex; }
  .alert-box {
    width: 270px;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    text-align: center;
  }
  .alert-title { font-size: 17px; font-weight: 700; color: var(--text-dark); padding: 20px 20px 6px; }
  .alert-message { font-size: 13px; color: var(--text-muted); padding: 0 20px 18px; line-height: 1.5; }
  .alert-actions { display: flex; border-top: 1px solid var(--border); }
  .alert-btn {
    flex: 1; background: none; border: none;
    padding: 14px 0; font-size: 17px; color: var(--blue);
    font-family: var(--font); cursor: pointer;
  }
  .alert-btn + .alert-btn { border-left: 1px solid var(--border); font-weight: 700; }

  /* ── Child data visibility ── */
  .child-data { display: none; }
  .child-data.visible { display: block; }
</style>
</head>
<body>

<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <span>●●● ▲ 🔋</span>
  </div>

  <div class="screen-wrap">

    <!-- ══════════════════════════════════════
         SCREEN 1 — CHORES
    ══════════════════════════════════════ -->
    <div class="screen" id="screen-chores">
      <div class="app-header">
        <h1>Lists</h1>
        <div class="header-actions">
          <button class="header-btn">🔔</button>
          <button class="header-btn">👤</button>
        </div>
      </div>

      <div class="tab-bar">
        <div class="tab">Shopping</div>
        <div class="tab">To Do</div>
        <div class="tab active">Chores</div>
      </div>

      <div class="week-nav">
        <button class="week-arrow">‹</button>
        <div class="week-days">
          <div class="day-circle"><span>Su</span><span>13</span></div>
          <div class="day-circle"><span>Mo</span><span>14</span></div>
          <div class="day-circle"><span>Tu</span><span>15</span></div>
          <div class="day-circle today"><span>We</span><span>16</span></div>
          <div class="day-circle"><span>Th</span><span>17</span></div>
          <div class="day-circle"><span>Fr</span><span>18</span></div>
          <div class="day-circle"><span>Sa</span><span>19</span></div>
        </div>
        <button class="week-arrow">›</button>
      </div>

      <div class="screen-body" id="chores-body"></div>

      <div class="bottom-nav">
        <div class="nav-item"><div class="nav-icon">🏠</div><div class="nav-label">Home</div></div>
        <div class="nav-item"><div class="nav-icon">📅</div><div class="nav-label">Calendar</div></div>
        <div class="nav-item active"><div class="nav-icon">📋</div><div class="nav-label">Lists</div></div>
        <div class="nav-item"><div class="nav-icon">🍽</div><div class="nav-label">Meals</div></div>
        <div class="nav-item"><div class="nav-icon">👨‍👩‍👧</div><div class="nav-label">Family</div></div>
      </div>
    </div>

    <!-- ══════════════════════════════════════
         SCREEN 2 — ALLOWANCE DASHBOARD
    ══════════════════════════════════════ -->
    <div class="screen offscreen-right" id="screen-dashboard">
      <div class="dash-header" style="flex-direction:column;align-items:stretch;padding-bottom:0;">
        <div style="display:flex;align-items:center;margin-bottom:8px;">
          <button class="back-btn" onclick="goBack('screen-chores')">‹ <span>Chores</span></button>
          <span class="dash-title">Allowance</span>
          <div style="width:80px;"></div>
        </div>
        <div class="child-tabs">
          <div class="child-tab active" id="tab-karla" onclick="switchChild('karla')">
            <div class="child-avatar" style="background:var(--orange)">K</div>
            Karla
          </div>
          <div class="child-tab" id="tab-sarah" onclick="switchChild('sarah')">
            <div class="child-avatar" style="background:var(--purple)">S</div>
            Sarah
          </div>
        </div>
      </div>

      <div class="screen-body" id="dash-body"></div>

      <div class="alert-overlay" id="alert-overlay">
        <div class="alert-box">
          <div class="alert-title" id="alert-title">Mark as paid?</div>
          <div class="alert-message" id="alert-message"></div>
          <div class="alert-actions">
            <button class="alert-btn" onclick="closeAlert()">Cancel</button>
            <button class="alert-btn" id="alert-confirm-btn">Mark as paid</button>
          </div>
        </div>
      </div>

      <div class="bottom-nav">
        <div class="nav-item"><div class="nav-icon">🏠</div><div class="nav-label">Home</div></div>
        <div class="nav-item"><div class="nav-icon">📅</div><div class="nav-label">Calendar</div></div>
        <div class="nav-item active"><div class="nav-icon">📋</div><div class="nav-label">Lists</div></div>
        <div class="nav-item"><div class="nav-icon">🍽</div><div class="nav-label">Meals</div></div>
        <div class="nav-item"><div class="nav-icon">👨‍👩‍👧</div><div class="nav-label">Family</div></div>
      </div>
    </div>

    <!-- ══════════════════════════════════════
         SCREEN 3 — ALLOWANCE SETTINGS
    ══════════════════════════════════════ -->
    <div class="screen offscreen-right" id="screen-allowance">
      <div class="allowance-header">
        <button class="back-btn-lt" onclick="goBack('screen-dashboard')">‹</button>
        <span class="allowance-title" id="allowance-child-name">Karla</span>
        <button class="history-btn">History</button>
      </div>

      <div class="screen-body" id="allowance-body"></div>

      <div class="bottom-nav">
        <div class="nav-item"><div class="nav-icon">🏠</div><div class="nav-label">Home</div></div>
        <div class="nav-item"><div class="nav-icon">📅</div><div class="nav-label">Calendar</div></div>
        <div class="nav-item active"><div class="nav-icon">📋</div><div class="nav-label">Lists</div></div>
        <div class="nav-item"><div class="nav-icon">🍽</div><div class="nav-label">Meals</div></div>
        <div class="nav-item"><div class="nav-icon">👨‍👩‍👧</div><div class="nav-label">Family</div></div>
      </div>
    </div>

  </div><!-- /screen-wrap -->
</div><!-- /phone -->

<script>
  const state = {
    andrew: {
      name: 'Andrew', color: '#3bbbe9', initial: 'A', isParent: true,
      chores: [
        { id: 'a1', label: 'Take out recycling', done: false },
        { id: 'a2', label: 'Mow the lawn', done: false },
      ],
    },
    karla: {
      name: 'Karla', color: 'var(--orange)', initial: 'K',
      chores: [
        { id: 'k1', label: 'Unload dishwasher', value: 3.00, done: true },
        { id: 'k2', label: 'Feed the dog', value: 3.00, done: true },
        { id: 'k3', label: 'Clean room', value: 3.00, done: false },
        { id: 'k4', label: 'Help with laundry', value: 3.00, done: false },
      ],
      allowanceOn: true,
      nextPayment: 'Monday, Sep 21',
      history: [
        { icon: '💰', name: 'Paid out', date: 'Sep 8', amount: 9.00, type: 'settled' },
        { icon: '🎁', name: 'Bonus from Grandma', date: 'Sep 5', amount: 5.00, type: 'credit' },
        { icon: '✅', name: 'Mowed the lawn', date: 'Sep 3', amount: 3.00, type: 'credit' },
      ],
    },
    sarah: {
      name: 'Sarah', color: 'var(--purple)', initial: 'S',
      chores: [
        { id: 's1', label: 'Set the table', value: 2.00, done: true },
        { id: 's2', label: 'Put away toys', value: 2.00, done: false },
        { id: 's3', label: 'Read for 20 min', value: 2.00, done: false },
        { id: 's4', label: 'Wipe bathroom sink', value: 2.00, done: false },
      ],
      allowanceOn: true,
      nextPayment: 'Monday, Sep 21',
      history: [
        { icon: '💰', name: 'Allowance paid out', date: 'Sep 8', amount: 8.00, type: 'settled' },
        { icon: '🎁', name: 'Bonus from Mom', date: 'Aug 28', amount: 5.00, type: 'credit' },
        { icon: '✅', name: 'Wiped bathroom sink', date: 'Sep 1', amount: 2.00, type: 'credit' },
      ],
    },
  };

  let currentScreen = 'screen-chores';
  let activeChild = 'karla';
  let pendingPayoutChild = null;

  function getEl(id) { return document.getElementById(id); }
  function money(n) { return '$' + n.toFixed(2); }

  function computeTotal(child) {
    return child.chores.reduce((sum, c) => sum + c.value, 0);
  }
  function computeEarned(child) {
    return child.chores.filter(c => c.done).reduce((sum, c) => sum + c.value, 0);
  }
  function choresLeft(child) {
    return child.chores.filter(c => !c.done).length;
  }

  // ── Chores screen ──
  function renderChores() {
    const order = ['andrew', 'karla', 'sarah'];
    getEl('chores-body').innerHTML = order.map(key => renderPersonSection(key)).join('');
  }

  function renderPersonSection(key) {
    const child = state[key];
    const choresHtml = child.chores.map(c => renderChoreItem(key, c)).join('');
    const chip = child.isParent ? '' :
      `<div class="allowance-chip" onclick="goTo('screen-dashboard','${key}')">💰 Allowance</div>`;
    return `
      <div class="person-section" style="${key === 'sarah' ? 'margin-bottom:12px' : ''}">
        <div class="person-header">
          <div class="person-dot" style="background:${child.color}">${child.initial}</div>
          <span class="person-name">${child.name}</span>
          ${chip}
        </div>
        ${choresHtml}
        <div class="add-chore">＋ Add chore</div>
      </div>`;
  }

  function renderChoreItem(key, chore) {
    const child = state[key];
    let valueHtml = '';
    if (!child.isParent) {
      valueHtml = `<span class="chore-value ${chore.done ? 'earned' : ''} editable"
        onclick="editChoreValue(event,'${key}','${chore.id}')"
        id="value-${key}-${chore.id}">${money(chore.value)}</span>`;
    }
    return `
      <div class="chore-item">
        <div class="chore-check ${chore.done ? 'checked' : ''}" onclick="toggleChore('${key}','${chore.id}')"></div>
        <span class="chore-label ${chore.done ? 'done' : ''}">${chore.label}</span>
        ${valueHtml}
      </div>`;
  }

  function toggleChore(key, choreId) {
    const child = state[key];
    const chore = child.chores.find(c => c.id === choreId);
    chore.done = !chore.done;
    renderAll();
  }

  function editChoreValue(event, key, choreId) {
    event.stopPropagation();
    const child = state[key];
    const chore = child.chores.find(c => c.id === choreId);
    const span = getEl(`value-${key}-${choreId}`);
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'chore-value-input';
    input.value = chore.value.toFixed(2);
    span.replaceWith(input);
    input.focus();
    input.select();

    function commit() {
      let val = parseFloat(input.value.replace(/[^0-9.]/g, ''));
      if (isNaN(val) || val < 0) val = chore.value;
      chore.value = val;
      renderAll();
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });
  }

  // ── Dashboard screen ──
  function renderDashboard() {
    const child = state[activeChild];
    const earned = computeEarned(child);
    const total = computeTotal(child);
    const pct = total > 0 ? Math.round((earned / total) * 100) : 0;
    const left = choresLeft(child);

    const payoutHtml = earned > 0
      ? `<button class="payout-btn" onclick="confirmPayout('${activeChild}')">Pay out ${money(earned)}</button>`
      : `<p class="payout-empty">No earnings yet — check off a chore to get started.</p>`;

    const historyHtml = child.history.length
      ? child.history.map(h => `
        <div class="activity-item">
          <div class="activity-icon">${h.icon}</div>
          <div class="activity-info">
            <div class="activity-name">${h.name}</div>
            <div class="activity-date">${h.date}</div>
          </div>
          <span class="activity-amount ${h.type}">${h.type === 'settled' ? '−' : '+'}${money(h.amount)}</span>
        </div>`).join('')
      : `<p class="activity-empty">No activity yet.</p>`;

    getEl('dash-body').innerHTML = `
      <div class="card">
        <div class="card-header">
          <span class="card-title">Earnings</span>
          <span class="edit-link" onclick="goTo('screen-allowance','${activeChild}')">Edit →</span>
        </div>
        <div class="earn-amount">${money(earned)} <span class="earn-total" style="font-size:16px">/ ${money(total)}</span></div>
        <div class="progress-row">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="chores-left">${left > 0 ? `<strong>${left} chore${left !== 1 ? 's' : ''}</strong> left` : 'All done!'}</span>
        </div>
        <p class="next-payment">Next payment: ${child.nextPayment}</p>
        ${payoutHtml}
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">Recent Activity</span>
        </div>
        ${historyHtml}
      </div>`;
  }

  function switchChild(child) {
    activeChild = child;
    ['karla', 'sarah'].forEach(c => getEl('tab-' + c).classList.toggle('active', c === child));
    renderDashboard();
  }

  function confirmPayout(key) {
    const child = state[key];
    const earned = computeEarned(child);
    pendingPayoutChild = key;
    getEl('alert-title').textContent = 'Mark as paid?';
    getEl('alert-message').textContent =
      `Mark ${money(earned)} as paid to ${child.name}? This clears her chores for the week.`;
    getEl('alert-confirm-btn').onclick = () => { markPaid(key); closeAlert(); };
    getEl('alert-overlay').classList.add('visible');
  }

  function closeAlert() {
    getEl('alert-overlay').classList.remove('visible');
    pendingPayoutChild = null;
  }

  function markPaid(key) {
    const child = state[key];
    const amt = computeEarned(child);
    if (amt <= 0) return;
    child.history.unshift({
      icon: '💰',
      name: 'Paid out',
      date: 'Today',
      amount: amt,
      type: 'settled',
    });
    child.chores.forEach(c => { if (c.done) c.done = false; });
    renderAll();
  }

  // ── Allowance settings screen ──
  function renderAllowanceScreen(key) {
    const child = state[key];
    getEl('allowance-child-name').textContent = child.name;

    const earned = computeEarned(child);
    const total = computeTotal(child);
    const pct = total > 0 ? Math.round((earned / total) * 100) : 0;
    const left = choresLeft(child);

    getEl('allowance-body').innerHTML = `
      <div class="section-label">Allowance</div>

      <div class="amount-row">
        <span class="amount-value">${money(total)}</span>
        <span class="amount-unit" style="margin-left:6px;">potential this week</span>
      </div>
      <div class="amount-meta">
        <p>Each chore has its own value — tap a chore's amount in the Chores list to change it.</p>
      </div>

      <div class="partial-card">
        <div class="partial-header">This week</div>
        <div class="partial-body">
          <div class="partial-circle-wrap">
            <div class="partial-circle" style="background:conic-gradient(var(--blue) ${pct}%, #e5e7eb ${pct}%)"></div>
            <div class="partial-inner"><span class="partial-pct">${pct}%</span></div>
          </div>
          <div class="partial-info">
            <div class="partial-earned">${money(earned)} earned</div>
            <div class="partial-label">of ${money(total)} potential</div>
            <div class="partial-chores">${left > 0 ? `${left} chore${left !== 1 ? 's' : ''} remaining` : 'All chores done'}</div>
          </div>
        </div>
      </div>

      <div class="toggle-row" onclick="toggleAllowance('${key}')">
        <span class="toggle-label">Allowance is ${child.allowanceOn ? 'on' : 'off'}</span>
        <div class="toggle-switch ${child.allowanceOn ? 'on' : ''}"></div>
      </div>
      <div class="toggle-note">
        Turn off to pause payouts. ${child.name} can still check off chores, but won't get paid until you turn it back on.
      </div>

      <div class="cta-card" onclick="goBack('screen-chores')">
        <div class="cta-icon">📋</div>
        <div>
          <div class="cta-text">Keep them on track</div>
          <div class="cta-sub">View and manage chores</div>
        </div>
        <div style="margin-left:auto;color:var(--blue-dk);font-size:18px;">›</div>
      </div>`;
  }

  function toggleAllowance(key) {
    state[key].allowanceOn = !state[key].allowanceOn;
    renderAllowanceScreen(key);
  }

  // ── Navigation ──
  function goTo(screenId, child) {
    const current = getEl(currentScreen);
    const next = getEl(screenId);
    current.classList.add('offscreen-left');
    next.classList.remove('offscreen-right');
    next.classList.remove('offscreen-left');
    if (screenId === 'screen-dashboard' && child) switchChild(child);
    if (screenId === 'screen-allowance') renderAllowanceScreen(child || activeChild);
    currentScreen = screenId;
  }

  function goBack(screenId) {
    const current = getEl(currentScreen);
    const prev = getEl(screenId);
    current.classList.add('offscreen-right');
    prev.classList.remove('offscreen-left');
    prev.classList.remove('offscreen-right');
    currentScreen = screenId;
  }

  function renderAll() {
    renderChores();
    renderDashboard();
    if (currentScreen === 'screen-allowance') renderAllowanceScreen(activeChild);
  }

  renderAll();
</script>
</body>
</html>
